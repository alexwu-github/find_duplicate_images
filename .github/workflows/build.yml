name: Build EXE
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install poetry
      - run: poetry install
      - run: poetry run pyinstaller --onefile --windowed src/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe